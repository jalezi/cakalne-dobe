name: ci

on:
  pull_request:
    # labeled/unlabeled re-run verify when baseline-growth-ok changes. Listing types replaces the defaults.
    types: [ opened, synchronize, reopened, labeled, unlabeled ]
  push:
    branches: [ main ]

permissions:
  contents: read

# A new PR run cancels that PR's previous one. Push runs group by SHA, so every commit on main keeps
# its own run: in a shared group, a newer run replaces a pending one even without cancel-in-progress.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The job stops after 10 minutes, so a hung step can't hold it for GitHub's 6-hour default. Runs take about a minute.
    timeout-minutes: 10
    steps:
      # On a PR, HEAD is GitHub's merge commit. Depth 2 also fetches its first parent, HEAD^1: the base commit
      # the merge was built on, whose baseline the growth gate compares with.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec biome ci .
      # Also writes coverage/coverage-final.json for fallow health
      - run: pnpm test:coverage
      - run: pnpm fallow

      # Logs the commit the growth gate compares with, next to the PR's base.sha, which matches it on a fresh PR
      - if: ${{ github.event_name == 'pull_request' }}
        run: echo "baseline base HEAD^1 $(git rev-parse HEAD^1), pull_request.base.sha $BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      # Fails on a finding missing from the baseline (re-save: pnpm fallow:health:baseline),
      # or on a baseline key that the PR's base commit doesn't have.
      - if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'baseline-growth-ok') }}
        run: pnpm exec fallow health --coverage coverage/coverage-final.json --baseline fallow-health-baseline.json --baseline-mode identity --fail-on-baseline-growth --baseline-base HEAD^1

      # A push has no base branch to compare against. With the maintainer's baseline-growth-ok label the baseline
      # may grow. Either way, a finding missing from the baseline still fails.
      - if: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'baseline-growth-ok') }}
        run: pnpm exec fallow health --coverage coverage/coverage-final.json --baseline fallow-health-baseline.json --baseline-mode identity
